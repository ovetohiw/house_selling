services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-CHANGE_ME}
      SQLITE_PATH: /app/data/bookings.db
    volumes:
      - bookings-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  bookings-data:
